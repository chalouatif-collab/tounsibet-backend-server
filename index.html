<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TounsiBet - Admin Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }
        .animate-float { animation: float 8s ease-in-out infinite; }
        .animate-float-delayed { animation: float 8s ease-in-out 4s infinite; }

        .glass-card {
            background: rgba(11, 16, 31, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8), 0 0 20px rgba(220, 38, 38, 0.1) inset;
        }

        .cyber-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(148, 163, 184, 0.2);
            transition: all 0.3s ease;
        }
        .cyber-input:focus {
            background: rgba(220, 38, 38, 0.05);
            border-color: rgba(220, 38, 38, 0.6);
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.2);
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-200 min-h-screen font-sans flex items-center justify-center p-4 relative overflow-hidden">

    <!-- مؤثرات الإضاءة الحمراء في الخلفية -->
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-red-600/20 rounded-full blur-[100px] pointer-events-none animate-float"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] bg-red-800/20 rounded-full blur-[120px] pointer-events-none animate-float-delayed"></div>

    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 w-full max-w-sm px-4 pointer-events-none"></div>

    <main class="w-full max-w-md glass-card rounded-[2rem] p-8 relative z-10">
        
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1 bg-gradient-to-r from-transparent via-red-500 to-transparent opacity-50"></div>

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-red-950 to-slate-900 border border-red-800/50 shadow-[0_0_20px_rgba(220,38,38,0.3)] mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4" />
                </svg>
            </div>
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-red-200 to-slate-400 tracking-tight">Tounsi<span class="text-red-500">Bet</span></h1>
            <p class="text-xs text-red-500/80 mt-1 uppercase tracking-[0.2em] font-bold">Secure Gateway</p>
        </div>

        <div id="step-1-login" class="space-y-5 text-sm font-bold transition-all duration-500 opacity-100 transform translate-x-0">
            <div class="space-y-1.5">
                <label class="text-slate-400 block px-1 text-xs uppercase tracking-wider">Identifiant</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <input type="text" id="auth-username" placeholder="Nom d'utilisateur" class="cyber-input w-full pl-11 pr-4 py-3.5 rounded-xl text-white font-mono placeholder-slate-600">
                </div>
            </div>
            
            <div class="space-y-1.5">
                <label class="text-slate-400 block px-1 text-xs uppercase tracking-wider">Mot de passe</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input type="password" id="auth-password" placeholder="••••••••" class="cyber-input w-full pl-11 pr-4 py-3.5 rounded-xl text-white font-mono placeholder-slate-600">
                </div>
            </div>
            
            <button onclick="handleLoginStep1()" id="btn-step-1" class="w-full relative group overflow-hidden rounded-xl p-4 bg-gradient-to-r from-red-600 to-red-800 font-black text-white shadow-[0_0_20px_rgba(220,38,38,0.3)] hover:shadow-[0_0_30px_rgba(220,38,38,0.5)] transition-all mt-4">
                <span class="relative z-10 uppercase tracking-widest text-xs">Authentification</span>
                <div class="absolute inset-0 bg-gradient-to-r from-red-500 to-red-600 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            </button>
        </div>

    </main>

    <script>
        // التوجيه للخادم الصحيح
        const BACKEND_URL = "https://tounsibet-backend-server.onrender.com";

        function showNotification(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,0.5)] border backdrop-blur-md text-xs font-bold flex items-center gap-3 transform translate-x-full transition-all duration-300 ${type === 'success' ? 'bg-emerald-950/80 border-emerald-500/50 text-emerald-100' : 'bg-rose-950/80 border-rose-500/50 text-rose-100'}`;
            
            const icon = type === 'success' 
                ? `<svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>` 
                : `<svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            
            toast.innerHTML = `${icon} <span class="tracking-wide">${message}</span>`;
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-x-full');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-4');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function handleLoginStep1() {
            const usernameInput = document.getElementById('auth-username').value.trim();
            const passwordInput = document.getElementById('auth-password').value;
            const btn = document.getElementById('btn-step-1');
            const btnText = btn.querySelector('span');
            
            if(!usernameInput || !passwordInput) return showNotification('Veuillez remplir tous les champs', 'error');

            btn.disabled = true;
            btnText.innerHTML = '<svg class="animate-spin h-4 w-4 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';

            try {
                const res = await fetch(`${BACKEND_URL}/api/login`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ username: usernameInput, password: passwordInput }) 
                });
                
                const finalData = await res.json();
                
                if (!res.ok) {
                    btn.disabled = false;
                    btnText.innerHTML = 'Authentification';
                    return showNotification(finalData.detail || 'Identifiants incorrects', 'error');
                }

                // طرد اللاعبين فوراً من بوابة الإدارة
                if(finalData.role === 'player') {
                    btn.disabled = false;
                    btnText.innerHTML = 'Authentification';
                    return showNotification('Accès interdit aux joueurs.', 'error');
                }

                // توجيه الإدارة وحفظ الجلسة
                if (finalData.access_token) {
                    localStorage.setItem('admin_token', finalData.access_token);
                }
                
                showNotification('Liaison sécurisée établie !', 'success');
                
                // توجيه ذكي للوحة المطلوبة مع تمرير التوكن في الرابط
                setTimeout(() => {
                    const rolePath = finalData.role.toLowerCase() === 'system' ? 'owner' : finalData.role;
                    window.location.href = `${BACKEND_URL}/panel/${rolePath}?token=${finalData.access_token}`;
                }, 800);

            } catch(e){ 
                btn.disabled = false;
                btnText.innerHTML = 'Authentification';
                showNotification('Erreur réseau. Serveur injoignable.', 'error'); 
            }
        }

        document.getElementById('auth-password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleLoginStep1();
        });
    </script>
</body>
</html>
